<body>

    <span class="spacer"></span>
    <button class="icon-btn" data-search aria-label="Поиск">🔍</button>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="logo" href="index.html" data-logo></a>
      <nav class="nav" id="nav">
        <a href="#/feed"><span class="ico">🏠</span>Лента</a>
        <a href="#/compass"><span class="ico">🧭</span>Компас взглядов<span class="new">NEW</span></a>
        <a href="#/consensus"><span class="ico">🤝</span>Карта согласия<span class="new">NEW</span></a>

    <a href="#/feed"><span>🏠</span>Лента</a>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
