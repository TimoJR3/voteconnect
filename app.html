<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta name="description" content="VoteConnect — гражданская социальная сеть, которая объединяет, а не разделяет.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f3efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VoteConnect">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body class="in-app">
  <div class="mobile-bar">
    <button class="icon-btn" id="menuBtn" aria-label="Открыть меню"><i data-i="menu"></i></button>
    <a class="logo" href="index.html" data-logo></a>
    <span class="spacer"></span>
    <button class="icon-btn" data-search aria-label="Поиск"><i data-i="search"></i></button>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="logo" href="index.html" data-logo></a>
      <div class="edition" id="edition"></div>
      <nav class="nav" id="nav">
        <a href="#/feed"><i class="ico" data-i="feed"></i>Лента</a>
        <a href="#/compass"><i class="ico" data-i="compass"></i>Компас взглядов</a>
        <a href="#/consensus"><i class="ico" data-i="consensus"></i>Карта согласия</a>
        <a href="#/polls"><i class="ico" data-i="polls"></i>Опросы</a>
        <div class="nav-title">Выборы</div>
        <a href="#/candidates"><i class="ico" data-i="people"></i>Кандидаты</a>
        <a href="#/promises"><i class="ico" data-i="promise"></i>Трекер обещаний</a>
        <a href="#/calendar"><i class="ico" data-i="calendar"></i>Календарь</a>
        <div class="nav-title">Сообщество</div>
        <a href="#/groups"><i class="ico" data-i="groups"></i>Группы и дебаты</a>
        <a href="#/initiatives"><i class="ico" data-i="megaphone"></i>Голосуй за меня</a>
        <a href="#/academy"><i class="ico" data-i="book"></i>Академия</a>
        <a href="#/profile"><i class="ico" data-i="profile"></i>Мой профиль</a>
        <div class="nav-title">Для кандидатов</div>
        <a href="#/cabinet"><i class="ico" data-i="chart"></i>Кабинет кандидата</a>
      </nav>
      <div class="side-actions">
        <button class="btn block" data-tour-start><i data-i="play"></i>Демо-тур</button>
        <button class="btn ghost block small" data-qr><i data-i="phone"></i>Открыть на телефоне</button>
      </div>
      <div class="countdown" id="countdown"></div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Основное меню">
    <a href="#/feed"><i data-i="feed"></i>Лента</a>
    <a href="#/compass"><i data-i="compass"></i>Компас</a>
    <a href="#/consensus"><i data-i="consensus"></i>Согласие</a>
    <a href="#/initiatives"><i data-i="megaphone"></i>Инициативы</a>
    <a href="#/profile"><i data-i="profile"></i>Профиль</a>
  </nav>

  <div id="onboard" class="onboard" hidden></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
